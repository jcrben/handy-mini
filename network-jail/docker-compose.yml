services:
  mitmproxy:
    image: mitmproxy/mitmproxy:11.0.2
    environment:
      NETWORK_JAIL_ENFORCE_ALLOWLIST: "1"
      NETWORK_JAIL_ALLOWLIST_FILE: ${NETWORK_JAIL_ALLOWLIST_FILE:-/addons/allowlist-run.txt}
      NETWORK_JAIL_PHASE: ${NETWORK_JAIL_PHASE:-unknown}
      NETWORK_JAIL_HOST_LOG: /data/observed-hosts.jsonl
    command:
      - mitmweb
      - --web-host
      - 0.0.0.0
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "8080"
      - --set
      - confdir=/home/mitmproxy/.mitmproxy
      - --set
      - block_global=false
      - --set
      - save_stream_file=/data/flows.mitm
      - -s
      - /addons/addons/host_inventory.py
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
    volumes:
      - ./mitmproxy:/addons:ro
      - ./runtime/mitmproxy:/home/mitmproxy/.mitmproxy
      - ./runtime/data:/data

  coredns:
    image: coredns/coredns:1.11.1
    command:
      - -conf
      - /etc/coredns/Corefile
    ports:
      - "127.0.0.1:1053:53/tcp"
      - "127.0.0.1:1053:53/udp"
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
      - ./runtime/data:/data
